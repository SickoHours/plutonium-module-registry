name: Update an entry
description: List a newer commit of a module or pack already listed here.
labels:
  - update
body:
  - type: input
    id: name
    attributes:
      label: Entry name
      placeholder: "someone/round_announcer"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: New commit to list (40 hexadecimal characters, pushed, tested)
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: What changed in the declaration (bases, maps, dependencies, provides, distribution)
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmations
      options:
        - label: The earlier listing may be kept under history; nothing is rewritten.
          required: true
        - label: The rights confirmations of the original submission still hold for this commit.
          required: true
